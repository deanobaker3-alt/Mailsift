<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mailsift-token" content="__MAILSIFT_TOKEN__">
<meta name="color-scheme" content="dark">
<title>mailsift // subscription cleaner</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap top-inner">
    <button type="button" class="brand" id="home" title="Back to the start (your scan results are kept)">
      <img src="/static/icon.png" alt="" width="32" height="32">
      <span class="brand-name">MAILSIFT</span>
      <span class="tag" id="version">v—</span>
      <span class="brand-sub">// subscription cleaner</span>
    </button>
    <a class="coffee" id="coffee" href="#" target="_blank" rel="noopener noreferrer" hidden>buy me a coffee</a>
    <div class="session" id="session" hidden>
      <span class="led" aria-hidden="true"></span>
      <span class="session-label">LINKED</span>
      <span id="account-name" class="session-user"></span>
      <button type="button" class="ghost" id="history">history</button>
      <button type="button" class="ghost" id="signout">sign out</button>
      <button type="button" class="ghost" id="quit">quit</button>
    </div>
    <div class="session" id="session-anon" hidden>
      <button type="button" class="ghost" id="quit-anon">quit</button>
    </div>
  </div>
  <div class="strip">
    <div class="wrap strip-inner" id="strip">
      <span>local-only</span>
      <span id="strip-tokens">tokens: —</span>
      <span>bodies: never read</span>
      <span id="strip-mode" class="mode">mode: —</span>
    </div>
  </div>
</header>

<main class="wrap main" id="main" tabindex="-1"></main>
<div class="sr-only" aria-live="polite" id="announce"></div>

<div class="actionbar" id="actionbar" hidden>
  <div class="wrap actionbar-inner">
    <code class="cmd" id="cmd"></code>
    <button type="button" class="btn btn-go" id="apply" disabled>review &amp; apply</button>
  </div>
</div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <form method="dialog" class="dialog-body">
    <div class="panel-title"><span id="confirm-title">confirm // live run</span></div>
    <div id="confirm-content"></div>
    <div class="buttons end">
      <button type="submit" value="cancel" class="btn">cancel</button>
      <button type="submit" value="ok" class="btn btn-go" id="confirm-ok">execute</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
