# GitHub's own code scanning. Finds security bugs Bandit misses, and anything
# it finds shows up in the repo's Security tab.
#
# On a PRIVATE repo this needs paid GitHub Advanced Security, so the gate job
# below skips the analysis rather than failing every push. It starts working
# by itself the moment the repo is made public.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 2"   # weekly, so new rules get applied to existing code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Is this repo public?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      # Asked via the API rather than the event payload, because scheduled runs
      # don't always carry repository details.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          visibility=$(gh api "repos/$REPO" --jq .visibility)
          echo "repository is $visibility"
          [ "$visibility" = "public" ] && echo "public=true" >> "$GITHUB_OUTPUT" || echo "public=false" >> "$GITHUB_OUTPUT"

  analyse:
    name: Analyse ${{ matrix.language }}
    needs: gate
    if: needs.gate.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
