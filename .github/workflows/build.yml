# Tests, security-scans and builds MailSift.exe on every push.
# Download: Actions tab > latest run > Artifacts > MailSift-windows.
#
# Hardening notes:
#  * third-party actions are pinned to full commit SHAs (a moved or hijacked tag can't change what runs)
#  * the workflow token is read-only and checkout doesn't keep git credentials around
#  * the build fails if tests fail, Bandit finds a medium+ issue, or pip-audit finds a known CVE
#  * every dependency is pinned to an exact version AND hash (requirements.lock), so a
#    hijacked package on PyPI can't be substituted into a build
#  * a SHA-256 checksum and a parts list (SBOM) are published with every build
#  * public builds get a signed build-provenance attestation (gh attestation verify)
#  * pushing a tag like v1.6.0 publishes a GitHub Release with the .exe, checksum and guide
name: Build MailSift.exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # only used by the provenance attestation step
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The client ID can live in a repo variable (Settings > Secrets and variables > Actions > Variables).
      # It isn't a secret. It's passed via env, never pasted into the script, so it can't inject commands.
      - name: Use MAILSIFT_CLIENT_ID variable if set
        if: ${{ vars.MAILSIFT_CLIENT_ID != '' }}
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.MAILSIFT_CLIENT_ID }}
        run: |
          if ($env:CLIENT_ID -notmatch '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$') { throw "MAILSIFT_CLIENT_ID isn't a GUID" }
          Add-Content -Path mailsift/client_id.txt -Value "`n$env:CLIENT_ID"

      - name: Use MAILSIFT_SUPPORT_URL variable if set
        if: ${{ vars.MAILSIFT_SUPPORT_URL != '' }}
        shell: pwsh
        env:
          SUPPORT_URL: ${{ vars.MAILSIFT_SUPPORT_URL }}
        run: |
          if ($env:SUPPORT_URL -notmatch '^https://(ko-fi\.com|(www\.)?buymeacoffee\.com|github\.com/sponsors|paypal\.me)/[A-Za-z0-9_-]{1,64}/?$') { throw "MAILSIFT_SUPPORT_URL must be a ko-fi.com, buymeacoffee.com, github.com/sponsors or paypal.me page" }
          Add-Content -Path mailsift/support_url.txt -Value "`n$env:SUPPORT_URL"

      # --require-hashes: pip refuses anything whose hash isn't in the lock file.
      - name: Install (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements.lock

      - name: Tests
        run: python -m pytest -q

      - name: Static analysis (Bandit, medium+ fails the build)
        run: python -m bandit -r mailsift -ll -q

      - name: Dependency audit (pip-audit, known CVEs fail the build)
        run: python -m pip_audit -r requirements.lock --disable-pip

      - name: Parts list (SBOM)
        run: python -m pip_audit -r requirements.lock --disable-pip -f cyclonedx-json -o MailSift-sbom.json

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = python -c "from mailsift import __version__; print(__version__)"
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG doesn't match mailsift/__init__.py version $v" }

      - name: Check a client ID is built in
        run: |
          python -c "from mailsift.app import bundled_client_id; import sys; sys.exit(0 if bundled_client_id() else 'No client ID - set the MAILSIFT_CLIENT_ID variable or edit mailsift/client_id.txt')"

      # The step above only proves a client ID is PRESENT and GUID-shaped. A
      # placeholder passes both, and v2.4.0 shipped that way: every check went
      # green and nobody could sign in, because the ID belonged to no app.
      # Microsoft is the only thing that can tell a real client ID from a
      # well-formed fake, so ask it. Fails only on a definite "no such client";
      # if Microsoft can't be reached, it warns and lets the build through.
      - name: Check Microsoft recognises the client ID
        shell: pwsh
        run: |
          $id = (python -c "from mailsift.app import bundled_client_id; print(bundled_client_id() or '')").Trim()
          if (-not $id) { throw "No client ID is built in" }
          $url = "https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize" +
                 "?client_id=$id&response_type=code&redirect_uri=http%3A%2F%2Flocalhost&scope=openid"
          try {
            $response = Invoke-WebRequest -Uri $url -MaximumRedirection 0 -SkipHttpErrorCheck -TimeoutSec 20
            $body = [string]$response.Content
          } catch {
            Write-Host "::warning::Could not reach Microsoft to check the client ID ($($_.Exception.Message)). Skipping."
            exit 0
          }
          if ($body -match "unauthorized_client" -or $body -match "client does not exist") {
            throw ("Microsoft does not recognise client ID $id. " +
                   "MAILSIFT_CLIENT_ID must be the Application (client) ID from the app " +
                   "registration's Overview page - not an example from the docs.")
          }
          Write-Host "Microsoft recognises the client ID."

      - name: Build MailSift.exe
        run: |
          python tools/make_version_info.py
          pyinstaller --noconfirm --clean --onefile --windowed --name MailSift --icon mailsift\icon.ico --version-file build\version_info.txt --add-data "mailsift\static;mailsift\static" --add-data "mailsift\client_id.txt;mailsift" --add-data "mailsift\support_url.txt;mailsift" mailsift_app.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MailSift.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MailSift.exe" | Out-File -Encoding ascii dist\MailSift.exe.sha256
          Copy-Item USER_GUIDE.txt dist\
          Copy-Item MailSift-sbom.json dist\ -ErrorAction SilentlyContinue
          "### MailSift.exe SHA-256`n``$hash``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # Signed proof that this exact .exe was built by this workflow from this commit.
      # (Free for public repos; skipped while the repo is private.)
      - name: Build provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MailSift.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MailSift-windows
          path: |
            dist/MailSift.exe
            dist/MailSift.exe.sha256
            dist/USER_GUIDE.txt
            dist/MailSift-sbom.json
          if-no-files-found: error

  release:
    # Only for version tags (v1.6.0 etc.), and only after the build job passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
      actions: read         # download this run's artifact
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --name MailSift-windows --dir dist
          HASH=$(cut -d' ' -f1 dist/MailSift.exe.sha256)
          cat > notes.md <<NOTES
          ## Download
          Grab **MailSift.exe** below (Windows 10/11). New to it? Read **USER_GUIDE.txt** first.

          ### Verify your download
          \`\`\`
          certutil -hashfile MailSift.exe SHA256
          \`\`\`
          should print \`$HASH\`.
          NOTES
          # Two ways a tag gets here: pushed from a clone, or created by
          # "Draft a new release" on github.com, which makes the release at
          # the same moment. In the second case "create" would fail and the
          # build's own .exe would never get attached, which is the one
          # thing this job exists to do. So: attach either way, and leave
          # notes written by hand alone.
          FILES="dist/MailSift.exe dist/MailSift.exe.sha256 dist/USER_GUIDE.txt dist/MailSift-sbom.json"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists: attaching the build to it."
            gh release upload "$TAG" --repo "$REPO" --clobber $FILES
            if [ -z "$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body' | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
            fi
          else
            gh release create "$TAG" --repo "$REPO" --title "MailSift $TAG" \
              --notes-file notes.md --generate-notes $FILES
          fi
          echo "### MailSift.exe SHA-256
          \`$HASH\`" >> "$GITHUB_STEP_SUMMARY"
