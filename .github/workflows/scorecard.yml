# OpenSSF Scorecard: an independent, automated check of this project's
# supply-chain health (pinned dependencies, branch protection, code review,
# dangerous workflow patterns...). Results appear in the repo's Security tab.
#
# Scorecard only works on public repositories, so the gate job below skips it
# while this repo is private. It starts working by itself once published.
name: Scorecard
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "19 6 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  gate:
    name: Is this repo public?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          visibility=$(gh api "repos/$REPO" --jq .visibility)
          echo "repository is $visibility"
          [ "$visibility" = "public" ] && echo "public=true" >> "$GITHUB_OUTPUT" || echo "public=false" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    needs: gate
    if: needs.gate.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          sarif_file: results.sarif
